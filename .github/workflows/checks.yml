name: Offline backtesting checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests (${{ matrix.os }}, ${{ matrix.suite }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [unit, historical]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned environment
        run: python -m pip install -r requirements.lock
      - name: Install project
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Verify frozen historical inputs
        if: matrix.suite == 'historical'
        run: python -m scripts.data_baseline
      - name: Verify identified equity dataset
        if: matrix.suite == 'historical'
        run: python -m scripts.equity_dataset
      - name: Run selected suite without network
        run: python -m scripts.check --suite ${{ matrix.suite }} --report artifacts/checks.json
      - name: Build and verify installed wheel
        if: matrix.suite == 'unit'
        run: python -m scripts.check_wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.suite }}
          path: artifacts/
